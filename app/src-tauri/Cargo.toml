[package]
name = "aurora-tauri"
version = "0.1.0"
description = "Aurora 启动器的 Tauri 外壳：把 aurora-core 门面通过 IPC 暴露给 React 前端"
authors = ["Aurora"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` 后缀避免 lib 与 bin 同名（Windows 上的已知冲突，见 rust-lang/cargo#8519）。
name = "aurora_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 门面：前端全部能力经此 crate 暴露，不直接依赖任何下层 crate。
aurora-core = { path = "../../crates/aurora-core" }
# managed state 用 tokio::sync::Mutex（Aurora 兼有 &self async 与 &mut self 方法）；
# 事件转发用 mpsc + spawn，故需 rt-multi-thread/macros/sync。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
# 自更新：检查 / 下载 / 安装新版本，安装包由 CI 用私钥签名，客户端以内置公钥校验。
# 官方示例把它挂在 cfg(desktop) 下，这里不必——Aurora 只出桌面端。
tauri-plugin-updater = "2"
# 更新装完要重启进程才能生效，重启走 process 插件。
tauri-plugin-process = "2"
# 背景图协议的路径解码：文件名可含中文与空格，WebView 发来的是 percent-encoded 形式。
# 已在 Tauri 依赖树里（url crate 依赖它），显式声明不额外增加编译量。
percent-encoding = "2"
# 系统文件选择框。选背景图必须拿到磁盘绝对路径，而 <input type="file"> 在 WebView 里
# 出于安全只给 File 对象、拿不到路径，所以这一步绕不开原生对话框。
tauri-plugin-dialog = "2"
# 日志：下层各 crate 只发事件，subscriber 在此层配置。开 time 特性是必须的——
# 不开的话每行时间戳会打成 <unknown time>，一份没有时间的日志排查不了任何东西。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
# 数据目录定位：日志要和 config.json 落在同一处，便携模式下随 exe 走。
aurora-base = { path = "../../crates/aurora-base" }

[dev-dependencies]
tempfile = "3"
